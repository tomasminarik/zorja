[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "aurora-backend"
version = "0.1.0"
description = "Offline foundation for an experimental aurora viewing backend"
requires-python = ">=3.13.16,<3.14"
dependencies = [
  "fastapi==0.143.0",
  "pydantic==2.14.1",
  "uvicorn==0.54.0",
  "tzdata==2026.5",
  "httpx==0.28.1",
  "astral==3.2",
]

[project.scripts]
aurora-backend = "aurora_backend.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.0",
  "mypy==2.4.0",
  "jsonschema==4.26.0",
  "openapi-spec-validator==0.9.0",
  "types-jsonschema==4.26.0.20261006",
]

[tool.hatch.build.targets.sdist]
include = [
  "/src/**", "/tests/**", "/tools/**",
  "/README.md", "/Makefile", "/Dockerfile", "/.env.example", "/.python-version",
  "/pyproject.toml", "/uv.lock", "/requirements.lock",
]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
